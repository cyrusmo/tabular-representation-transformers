[project]
name = "tabular-state-transformer"
version = "0.1.0"
description = "Experimental architecture for non-smooth, interaction-heavy tabular tasks."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml", "scikit-learn", "torch", "tqdm"]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
benchmark = ["catboost", "datasets", "lightgbm", "openml", "xgboost"]
benchmarks = ["catboost", "datasets", "lightgbm", "openml", "xgboost"]
dev = ["jupyter", "mypy", "pytest", "ruff"]
hub = ["huggingface_hub", "safetensors"]
viz = ["matplotlib", "seaborn"]
viz3d = ["matplotlib", "pillow", "plotly"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
